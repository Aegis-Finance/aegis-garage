# /etc/nginx/sites-available/garage.aegisprotocol.org
# Symlink to sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx

upstream aegis_garage {
    server 127.0.0.1:4321;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name garage.aegisprotocol.org;

    location / {
        proxy_pass http://aegis_garage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
